name: CI/CD Pipeline — Spring Boot + Docker + GHCR

on:
  push:
    branches:
      - main
      - feature/models

env:
  IMAGE_NAME: ghcr.io/nnni-1/etflux:latest

jobs:
  # ========= JOB 1: Build Docker Image =========
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Maven project and run tests
        run: |
          mvn clean package

      - name: Check if JAR exists in target/
        run: |
          if [ -f target/etflux-1.0-SNAPSHOT.jar ]; then
            echo "JAR found!"
          else
            echo "JAR NOT FOUND!" && exit 1
          fi

      - name: Prepare Docker context
        run: |
          mkdir -p build
          cp target/etflux-1.0-SNAPSHOT.jar build/app.jar

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      - name: Build local Docker image
        run: |
          docker build -t etflux-local:latest .

      - name: Tag for GitHub Container Registry
        run: |
          docker tag etflux-local:latest $IMAGE_NAME

      - name: List Docker images
        run: |
          docker images

      - name: Log in to GitHub Container Registry
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

  # ========= JOB 3: Deploy on Server =========
  deploy:
    name: Deploy on VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry on the server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SERVER_IP} << EOF
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          EOF

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Create remote directory if not exists
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh ${SSH_USER}@${SERVER_IP} << EOF
            mkdir -p /home/${SSH_USER}/etflux
          EOF

      - name: Check remote directory existence
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh ${SSH_USER}@${SERVER_IP} << EOF
            ls -ld /home/${SSH_USER}/etflux
          EOF

      - name: Deploy files via rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            --exclude .git \
            --exclude .github \
            --exclude target \
            . ${SSH_USER}@${SERVER_IP}:/home/${SSH_USER}/etflux

      - name: Check if docker-compose.yml exists
        run: |
          if [ -f docker-compose.yml ]; then
            echo "docker-compose.yml found!"
          else
            echo "docker-compose.yml NOT FOUND!" && exit 1
          fi

      - name: Replace image name in docker-compose.yml
        run: |
          sed -i "s|image: etflux|image: $IMAGE_NAME|g" docker-compose.yml

      - name: Pull and restart containers
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh ${SSH_USER}@${SERVER_IP} << EOF
            cd /home/${SSH_USER}/etflux
            docker compose pull
            docker compose down
            docker compose --profile full up -d
          EOF