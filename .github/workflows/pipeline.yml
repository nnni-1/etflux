name: CI/CD Pipeline — Spring Boot + Docker + GHCR

on:
  push:
    branches:
      - main
      - feature/models

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:latest

jobs:
  # ========= JOB 1: Build Docker Image =========
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Maven project and run tests
        run: |
          mvn clean package

      - name: Prepare Docker context
        run: |
          mkdir -p build
          cp target/etflux-1.0-SNAPSHOT.jar build/app.jar
            
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

  # ========= JOB 2: Push Image to GitHub Container Registry =========
  push:
    name: Push to GitHub Container Registry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

  # ========= JOB 3: Deploy on Server =========
  deploy:
    name: Deploy on VPS
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check if .env exists locally
        run: |
          if [ -f prod.env ]; then
            echo "prod.env found!"
          else
            echo "prod.env NOT FOUND!" && exit 1
          fi

      - name: Deploy files via rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -avz -e ssh \
            --exclude .git \
            --exclude .github \
            --exclude target \
            . ${SSH_USER}@${SERVER_IP}:/home/${SSH_USER}/etflux

      - name: Checkout docker-compose.yml
        uses: actions/checkout@v3

      - name: Replace image name in docker-compose.yml
        run: |
          sed -i "s|image: etflux|image: ghcr.io/${{ github.repository }}/etflux:latest|g" docker-compose.yml

      - name: Deploy files via rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -avz -e ssh \
            --exclude .git \
            --exclude .github \
            --exclude target \
            . ${SSH_USER}@${SERVER_IP}:/home/${SSH_USER}/etflux

      - name: Pull and restart containers
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh ${SSH_USER}@${SERVER_IP} << 'EOF'
            cd /home/${SSH_USER}/etflux
            docker-compose pull
            docker-compose down
            docker-compose up -d
          EOF