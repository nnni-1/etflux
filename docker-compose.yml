version: '3.8'
networks:
  etflux-network:
services:
  postgres:
    env_file:
      - local.env
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    networks:
      - etflux-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  etflux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etflux
    restart: always
    env_file:
      - local.env
    ports:
      - "8082:8080"
    networks:
      - etflux-network
    depends_on:
      - postgres

volumes:
  postgres_data: