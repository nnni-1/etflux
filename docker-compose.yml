version: '3.8'
networks:
  etflux-network:

services:
  postgres-db:
    env_file:
      - .env
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5433:5432"
    networks:
      - etflux-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["sh", "-c", "echo 'POSTGRES_USER='$$POSTGRES_USER && echo 'POSTGRES_PASSWORD='$$POSTGRES_PASSWORD && echo 'POSTGRES_DB='$$POSTGRES_DB && docker-entrypoint.sh postgres"]

  etflux:
    image: ghcr.io/nnni-1/etflux:latest
#    build:
#      dockerfile: ./Dockerfile
#      context: .
    container_name: etflux
    restart: always
    profiles:
      - full
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-db:5432/postgres
    env_file:
      - .env
    ports:
      - "8082:8082"
    networks:
      - etflux-network
    depends_on:
      - postgres-db

volumes:
  postgres_data: