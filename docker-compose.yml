version: '3.8'
networks:
  etflux-network:
services:
  postgres:
    env_file:
      - prod.env
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5433:5433"
    networks:
      - etflux-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  etflux:
    image: ghcr.io/nnni-1/etflux:latest
    container_name: etflux
    restart: always
    profiles:
      - full
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5433/postgres
    env_file:
      - prod.env
    ports:
      - "8082:8080"
    networks:
      - etflux-network
    depends_on:
      - postgres

volumes:
  postgres_data: