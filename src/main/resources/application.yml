spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  session:
    jdbc:
      initialize-schema: always
  profiles:
    active: dev

  jpa:
    hibernate:
      properties:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: update
    show-sql: true

server:
  port: 8082

logging:
  level:
    web: debug

jwt:
  secret:
    ${JWT_SECRET}
  access-token:
    ttl:
      ${JWT_ACCESS_TTL}
api:
  tbank:
    token:
      ${TBANK_INVEST_API_TOKEN}
    url:
      instrumentBy: https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/FindInstrument
      shareBy: https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/ShareBy

  moex:
    password:
      ${MOEX_API_PASSWORD}
