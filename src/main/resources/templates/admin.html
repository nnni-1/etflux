<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Админка: Пользователи</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .actions select,
        .btn {
            padding: 6px 12px;
            margin-right: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn {
            border: none;
            border-radius: 4px;
            color: white;
        }

        .btn-primary {
            background-color: #007bff;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-success {
            background-color: #28a745;
        }

        .role-badge {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin: 2px;
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .pagination button {
            padding: 6px 12px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .pagination button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<h1>Панель Администратора — Пользователи</h1>

<div style="margin-bottom: 20px;">
    <input type="text" id="searchInput" placeholder="Поиск по имени или email..." oninput="filterUsers()" />
</div>

<table id="usersTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Роли</th>
        <th>Создан</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody id="usersBody">
    </tbody>
</table>

<div class="pagination" id="paginationControls">
    <button onclick="prevPage()">Назад</button>
    <button onclick="nextPage()">Вперед</button>
</div>

<script>
    let currentPage = 0;
    let allUsers = [];

    async function loadUsers(page = 0) {
        const response = await fetch(`/api/admin/users?page=${page}&size=10`);
        const users = await response.json();
        allUsers = users;
        renderUsers(users);
    }

    function renderUsers(users) {
        const tbody = document.getElementById("usersBody");
        tbody.innerHTML = "";

        for (const user of users) {
            const rolesHtml = (user.roles || []).map(r => `<span class="role-badge">${r.role}</span>`).join("");

            const tr = document.createElement("tr");
            tr.innerHTML = `
        <td>${user.id}</td>
        <td>${user.username}</td>
        <td>${user.email}</td>
        <td>${rolesHtml}</td>
        <td>${new Date(user.createdAt).toLocaleString()}</td>
        <td>${user.active ? "Активен" : "Заблокирован"}</td>
        <td>
          <div class="user-actions">
            <select onchange="changeRole(${user.id}, this.value)">
              <option value="">-- Изменить роль --</option>
              <option value="34">ADMIN</option>
              <option value="36">MODERATOR</option>
              <option value="35">USER</option>
            </select>
            <button onclick="toggleStatus(${user.id})" class="btn ${user.active ? 'btn-danger' : 'btn-success'}">
              ${user.active ? "Заблокировать" : "Разблокировать"}
            </button>
          </div>
        </td>
      `;
            tbody.appendChild(tr);
        }
    }

    async function changeRole(userId, roleId) {
        if (!roleId) return;
        const response = await fetch(`/api/admin/users/add-role/${userId}?roleId=${roleId}`, { method: "GET" });
        if (response.ok) {
            alert("Роль изменена");
            loadUsers(currentPage);
        } else {
            alert("Ошибка при изменении роли");
        }
    }

    async function toggleStatus(userId) {
        const response = await fetch(`/api/admin/users/change-status/${userId}?status=TOGGLE`, { method: "GET" });
        if (response.ok) {
            alert("Статус изменён");
            loadUsers(currentPage);
        } else {
            alert("Ошибка при изменении статуса");
        }
    }

    function filterUsers() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const filtered = allUsers.filter(u =>
            u.username.toLowerCase().includes(query) ||
            u.email.toLowerCase().includes(query)
        );
        renderUsers(filtered);
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            loadUsers(currentPage);
        }
    }

    function nextPage() {
        currentPage++;
        loadUsers(currentPage);
    }

    window.onload = () => loadUsers();
</script>

</body>
</html>
