<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Админка: Пользователи</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .actions select,
        .btn {
            padding: 6px 12px;
            margin-right: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn {
            border: none;
            border-radius: 4px;
            color: white;
        }

        .btn-primary {
            background-color: #007bff;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-success {
            background-color: #28a745;
        }

        .role-badge {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin: 2px;
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .pagination button {
            padding: 6px 12px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .pagination button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<h1>Панель Администратора — Пользователи</h1>

<div style="margin-bottom: 20px;">
    <input type="text" id="searchInputUsername" placeholder="Поиск по username..." />
    <input type="text" id="searchInputEmail" placeholder="Поиск по email..." />
</div>

<table id="usersTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Роли</th>
        <th>Создан</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody id="usersBody">
    </tbody>
</table>

<div class="pagination">
    <button id="btnPrev" onclick="prevPage()">Назад</button>
    <button id="btnNext" onclick="nextPage()">Вперед</button>
</div>
<div class="btn" id="searchAllButton">
    <button onclick="currPage()">Найти всех пользователей</button>
</div>
<div id="pageInfo"></div>

<input id="token" type="hidden" th:value="${token}">
<script>
    let currentPage = 0;
    let allUsers = [];
    let searchingByUsername = false;
    let searchingByEmail = false;
    let searchingAll = true;

    const searchInputUsernameElement = document.getElementById('searchInputUsername');
    const searchInputEmailElement = document.getElementById('searchInputEmail');

    // --- Слушатели событий ---
    searchInputUsernameElement.addEventListener('input', () => {
        const val = searchInputUsernameElement.value.trim().toLowerCase();
        if (!val) {
            searchingByUsername = false;
            searchingByEmail = false;
            searchingAll = true;
        } else {
            searchingByUsername = true;
            searchingByEmail = false;
            searchingAll = false;
        }
        currentPage = 0;
        filterUsersByUsername(currentPage, val);
    });

    searchInputEmailElement.addEventListener('input', () => {
        const val = searchInputEmailElement.value.trim().toLowerCase();
        if (!val) {
            searchingByUsername = false;
            searchingByEmail = false;
            searchingAll = true;
        } else {
            searchingByUsername = false;
            searchingByEmail = true;
            searchingAll = false;
        }
        currentPage = 0;
        filterUsersByEmail(currentPage, val);
    });

    // --- Загрузка данных ---
    async function loadUsers(page = 0) {
        showLoading(true);
        try {
            const token = document.getElementById("token").value;
            const response = await fetch(`/api/admin/users?page=${page}&size=10`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) throw new Error("Ошибка загрузки пользователей");

            const data = await response.json();
            allUsers = data;
            renderUsers(data);
        } catch (error) {
            alert("Не удалось загрузить пользователей");
            console.error(error);
        } finally {
            showLoading(false);
        }
    }

    async function filterUsersByUsername(page = 0, username = '') {
        showLoading(true);
        try {
            const token = document.getElementById("token").value;
            const response = await fetch(`/api/admin/users?username=${encodeURIComponent(username)}&page=${page}&size=10`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) throw new Error("Ошибка поиска по имени");

            const data = await response.json();
            allUsers = data;
            renderUsers(data);
        } catch (error) {
            alert("Ошибка поиска по имени");
            console.error(error);
        } finally {
            showLoading(false);
        }
    }

    async function filterUsersByEmail(page = 0, email = '') {
        showLoading(true);
        try {
            const token = document.getElementById("token").value;
            const response = await fetch(`/api/admin/users?email=${encodeURIComponent(email)}&page=${page}&size=10`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) throw new Error("Ошибка поиска по email");

            const data = await response.json();
            allUsers = data;
            renderUsers(data);
        } catch (error) {
            alert("Ошибка поиска по email");
            console.error(error);
        } finally {
            showLoading(false);
        }
    }

    // --- Отрисовка таблицы ---
    function renderUsers(data) {
        const users = data.content || [];
        const isLast = data.last === true;

        const tbody = document.getElementById("usersBody");
        if (!tbody) return;

        tbody.innerHTML = "";

        for (const user of users) {
            const rolesHtml = (user.roles || [])
                .map(r => `<span class="role-badge">${r.role}</span>`).join("");

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${user.id}</td>
                <td>${user.username}</td>
                <td>${user.email}</td>
                <td>${rolesHtml}</td>
                <td>${new Date(user.createdAt).toLocaleString()}</td>
                <td>${user.active ? "Активен" : "Заблокирован"}</td>
                <td>
                    <div class="user-actions">
                        <select onchange="changeRole(${user.id}, this.value)">
                            <option value="">-- Добавить роль --</option>
                            <option value="1">ADMIN</option>
                            <option value="3">MODERATOR</option>
                            <option value="2">USER</option>
                        </select>
                        <select onchange="deleteRole(${user.id}, this.value)">
                            <option value="">-- Удалить роль --</option>
                            ${user.roles.map(role => `<option value="${role.id}">${role.role}</option>`).join("")}
                        </select>
                        <button onclick="toggleStatus(${user.id})" class="btn ${user.active ? 'btn-danger' : 'btn-success'}">
                            ${user.active ? "Заблокировать" : "Разблокировать"}
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        }

        updatePaginationButtons(currentPage === 0, isLast);
    }

    // --- Функции изменения состояния ---
    async function deleteRole(userId, roleId) {
        if (!roleId) return;
        const token = document.getElementById("token").value;
        const response = await fetch(`/api/admin/users/delete-role/${userId}?roleId=${roleId}`, {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        if (response.ok) {
            alert("Роль удалена");
            loadOrFilter();
        } else {
            alert("Ошибка при изменении роли");
        }
    }

    async function changeRole(userId, roleId) {
        if (!roleId) return;
        const token = document.getElementById("token").value;
        const response = await fetch(`/api/admin/users/add-role/${userId}?roleId=${roleId}`, {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        if (response.ok) {
            alert("Роль добавлена");
            loadOrFilter();
        } else {
            alert("Ошибка при изменении роли");
        }
    }

    async function toggleStatus(userId) {
        const token = document.getElementById("token").value;
        const user = allUsers.content.find(u => u.id === userId);
        const newStatus = user.active ? 'BLOCKED' : 'ACTIVE';

        const response = await fetch(`/api/admin/users/change-status/${userId}?status=${newStatus}`, {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.ok) {
            alert("Статус изменён");
            loadOrFilter();
        } else {
            alert("Ошибка при изменении статуса");
        }
    }

    // --- Пагинация ---
    function currPage() {
        searchingByUsername = false;
        searchingByEmail = false;
        searchingAll = true;

        searchInputEmailElement.value = '';
        searchInputUsernameElement.value = '';
        currentPage = 0;
        loadUsers(currentPage);
    }

    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            loadOrFilter();
        }
    }

    function nextPage() {
        currentPage++;
        loadOrFilter();
    }

    function loadOrFilter() {
        if (searchingByUsername) {
            filterUsersByUsername(currentPage, searchInputUsernameElement.value.toLowerCase());
        } else if (searchingByEmail) {
            filterUsersByEmail(currentPage, searchInputEmailElement.value.toLowerCase());
        } else {
            loadUsers(currentPage);
        }
    }

    function updatePaginationButtons(isFirst, isLast) {
        document.getElementById("btnPrev").disabled = isFirst;
        document.getElementById("btnNext").disabled = isLast;
    }

    function showLoading(show) {
        const loading = document.getElementById("loading");
        if (loading) loading.style.display = show ? "block" : "none";
    }

    // --- Инициализация ---
    window.onload = () => loadUsers();
</script>

</body>
</html>
