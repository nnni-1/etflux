<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кристина лучшая</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans :wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Обнуление стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #fbc2eb);
            background-size: 400% 400%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Pacifico', cursive;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow: hidden;
        }

        h1 {
            font-size: 4rem;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.3);
            animation: fadeInZoom 2s ease-out;
            text-align: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInZoom {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
<h1>Кристина лучшая ❤️</h1>
</body>
</html>
