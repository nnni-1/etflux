<!DOCTYPE html>
<html lang="ru">
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .controls {
            margin: 15px 0;
        }

        .controls input {
            padding: 5px;
            width: 250px;
        }

        .pagination button {
            padding: 6px 12px;
            margin: 0 5px;
        }

        .pagination span {
            margin: 0 10px;
        }
    </style>
</head>
<body>
<h1>Панель администратора</h1>

<div class="controls">
    <input type="text" id="searchInput" placeholder="Поиск по username или ID" oninput="onSearchChange()" />
</div>

<table id="userTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Роль</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <!-- Пользователи подгружаются сюда -->
    </tbody>
</table>

<div class="pagination">
    <button onclick="prevPage()">⟵ Назад</button>
    <span id="pageInfo">Страница 1</span>
    <button onclick="nextPage()">Вперёд ⟶</button>
</div>
<input id="token" type="hidden" th:value="${token}">
<script>
    let currentPage = 0;
    const pageSize = 10;
    let currentSearch = '';
    let lastPageReached = false;

    // Получаем токен
    const tokenInput = document.getElementById("token");
    const token = tokenInput ? tokenInput.value : null;

    if (!token) {
        alert("Токен не найден!");
    }

    async function loadUsers() {
        try {
            const url = `/api/admin/users?page=${currentPage}&size=${pageSize}`;

            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    alert("Ошибка авторизации. Перезалогиньтесь.");
                } else {
                    throw new Error(`HTTP ошибка: ${response.status}`);
                }
                return;
            }

            const data = await response.json();

            // Проверяем, что пришёл правильный формат данных
            if (!data || !Array.isArray(data.content)) {
                console.error("Ошибка формата данных:", data);
                alert("Ошибка: неверный формат ответа от сервера");
                return;
            }

            const users = data.content;
            lastPageReached = data.last === true;

            const tbody = document.querySelector('#userTable tbody');
            tbody.innerHTML = '';

            console.log('data:', data);
            console.log('data.content:', data.content);
            console.log('typeof data.content:', typeof data.content);
            console.log('Array.isArray(data.content):', Array.isArray(data.content));
            console.log('users:', users);

            if (users.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="5" style="text-align:center;">Нет пользователей</td>`;
                tbody.appendChild(row);
            } else {
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td>${user.roles.map(r => r.role).join(', ')}</td>
                    <td>${user.active ? 'Активен' : 'Заблокирован'}</td>
                `;
                    tbody.appendChild(row);
                });
            }

            document.getElementById('pageInfo').textContent = `Страница ${currentPage + 1}`;

        } catch (error) {
            console.error("Ошибка загрузки пользователей:", error);
            alert("Ошибка загрузки данных. Проверьте подключение или попробуйте позже.");
        }
    }

    function nextPage() {
        if (!lastPageReached) {
            currentPage++;
            loadUsers();
        }
    }

    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            loadUsers();
        }
    }

    function onSearchChange() {
        const input = document.getElementById('searchInput');
        currentSearch = input.value.trim();
        currentPage = 0;
        loadUsers();
    }

    window.addEventListener('DOMContentLoaded', loadUsers);
</script>
</body>
</html>
