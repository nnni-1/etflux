<!DOCTYPE html>
<html lang="ru">
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .controls {
            margin: 15px 0;
        }

        .controls input {
            padding: 5px;
            width: 250px;
        }

        .pagination button {
            padding: 6px 12px;
            margin: 0 5px;
        }

        .pagination span {
            margin: 0 10px;
        }
    </style>
</head>
<body>
<h1>Панель администратора</h1>

<div class="controls">
    <input type="text" id="searchInput" placeholder="Поиск по username или ID" oninput="onSearchChange()" />
</div>

<table id="userTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Роль</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <!-- Пользователи подгружаются сюда -->
    </tbody>
</table>

<div class="pagination">
    <button onclick="prevPage()">⟵ Назад</button>
    <span id="pageInfo">Страница 1</span>
    <button onclick="nextPage()">Вперёд ⟶</button>
</div>
<input id="token" type="hidden" th:value="${token}">
<script>
    let currentPage = 0;
    const pageSize = 10;
    let currentSearch = '';
    let lastPageReached = false;
    const token = Document.getElementById("token").value
    //&search=${encodeURIComponent(currentSearch)}
    async function loadUsers() {
        try {
            const response = await fetch(`/api/admin/users?page=${currentPage}&size=${pageSize}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ` + token
                }

            });
            if (!response.ok) throw new Error('Ошибка при загрузке данных');
            const users = await response.json();

            const tbody = document.querySelector('#userTable tbody');
            tbody.innerHTML = '';

            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.role}</td>
            <td>${user.active ? 'Активен' : 'Заблокирован'}</td>
          `;
                tbody.appendChild(row);
            });

            document.getElementById('pageInfo').textContent = `Страница ${currentPage + 1}`;
            lastPageReached = users.length < pageSize;

        } catch (error) {
            alert('Ошибка: ' + error.message);
        }
    }

    function nextPage() {
        if (!lastPageReached) {
            currentPage++;
            loadUsers();
        }
    }

    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            loadUsers();
        }
    }

    function onSearchChange() {
        const input = document.getElementById('searchInput');
        currentSearch = input.value.trim();
        currentPage = 0;
        loadUsers();
    }

    window.addEventListener('DOMContentLoaded', loadUsers);
</script>
</body>
</html>
