<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .register-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }

        .input-field {
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #6e8efb;
            outline: none;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background-color: #6e8efb;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .register-btn:hover {
            background-color: #5a7de2;
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #6e8efb;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #5a7de2;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2>Регистрация</h2>
    <form th:action="@{/register}" method="post" th:object="${registrationForm}">
        <input type="text" name="username" id="username" class="input-field" placeholder="Имя пользователя" required
               th:field="*{username}">
        <div id="usernameStatus">
            <!-- место для уведомления о том что юзер с таким ником уже есть -->
        </div>

        <div class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <input type="email" name="email" class="input-field" placeholder="Электронная почта" required
               th:field="*{email}">
        <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <input type="password" name="password" class="input-field" placeholder="Пароль" required
               th:field="*{password}">
        <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <input type="password" name="confirmPassword" class="input-field" placeholder="Подтвердите пароль" required
               th:field="*{confirmPassword}">
        <div class="error-message" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        <input type="hidden" th:name="${_csrf.getParameterName()}" th:value="${_csrf.getToken()}"/>
        <button type="submit" class="register-btn">Зарегистрироваться</button>
    </form>
    <div class="login-link">
        Уже есть аккаунт? <a href="/c-login">Войдите</a>
    </div>
</div>
</body>
</html>
<script>
    const updateUsernameStatus = (message, isAvailable) => {
        const statusDiv = document.getElementById('usernameStatus');
        statusDiv.textContent = message;
        statusDiv.style.color = isAvailable ? 'green' : 'red';
    };

    const usernameInput = document.getElementById('username');
    usernameInput.addEventListener('input', () => {
        const username = usernameInput.value.trim();
        if (username.length === 0) {
            updateUsernameStatus('', true);
            return;
        }

        const userExistsUrl = `http://localhost:8080/api/v1/users?username=${encodeURIComponent(username)}`;
        fetch(userExistsUrl, {
            method: 'GET',
        })
            .then(response => response.json())
            .then(data => {
                if (data.userExists) {
                    updateUsernameStatus('Nickname is already taken', false);
                } else {
                    updateUsernameStatus('Nickname is available', true);
                }
            })
            .catch(error => {
                console.error('Error checking username:', error);
                updateUsernameStatus('Some troubles to check if this nickname is available, try later', false);
            });
    });
</script>
