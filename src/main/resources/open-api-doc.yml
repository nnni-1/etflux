openapi: 3.0.2
info:
  title: Asset Tracking Service API
  description: Сервис для отслеживания всех активов пользователя в одном месте.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Локальный сервер для разработки

tags:
  - name: Users
    description: Операции с пользователями
  - name: Asset Types
    description: Управление типами активов
  - name: Assets
    description: Управление активами пользователей
  - name: Transactions
    description: Операции с транзакциями
  - name: Market Data
    description: Актуальные рыночные данные
  - name: User Profiles
    description: Профили пользователей

paths:
  /users:
    post:
      tags:
        - Users
      summary: Создать нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Пользователь успешно создан
        '400':
          description: Неверный запрос

    get:
      tags:
        - Users
      summary: Получить список всех пользователей
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Получить пользователя по ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден

  /asset-types:
    post:
      tags:
        - Asset Types
      summary: Создать новый тип актива
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetType'
      responses:
        '201':
          description: Тип актива успешно создан

    get:
      tags:
        - Asset Types
      summary: Получить список всех типов активов
      responses:
        '200':
          description: Список типов активов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetType'

  /assets:
    post:
      tags:
        - Assets
      summary: Добавить новый актив для пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
      responses:
        '201':
          description: Актив успешно добавлен

    get:
      tags:
        - Assets
      summary: Получить список всех активов пользователя
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Список активов пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'

  /transactions:
    post:
      tags:
        - Transactions
      summary: Добавить новую транзакцию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '201':
          description: Транзакция успешно добавлена

    get:
      tags:
        - Transactions
      summary: Получить список всех транзакций пользователя
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Список транзакций пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /market-data:
    get:
      tags:
        - Market Data
      summary: Получить текущие рыночные данные
      parameters:
        - in: query
          name: asset_symbol
          required: true
          schema:
            type: string
          description: Символ актива (например, "AAPL", "BTC")
      responses:
        '200':
          description: Текущие рыночные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketData'

  /user-profiles:
    post:
      tags:
        - User Profiles
      summary: Создать или обновить профиль пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '201':
          description: Профиль успешно создан или обновлен

    get:
      tags:
        - User Profiles
      summary: Получить профиль пользователя
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: Уникальный идентификатор пользователя
        username:
          type: string
          description: Имя пользователя
        email:
          type: string
          format: email
          description: Email пользователя
        password_hash:
          type: string
          description: Хэш пароля
        created_at:
          type: string
          format: date-time
          description: Дата создания пользователя
      required:
        - username
        - email
        - password_hash

    AssetType:
      type: object
      properties:
        id:
          type: integer
          description: Уникальный идентификатор типа актива
        name:
          type: string
          description: Название типа актива (например, "Stocks", "Bonds")
        description:
          type: string
          description: Описание типа актива
      required:
        - name

    Asset:
      type: object
      properties:
        id:
          type: integer
          description: Уникальный идентификатор актива
        user_id:
          type: integer
          description: ID пользователя, которому принадлежит актив
        asset_type_id:
          type: integer
          description: ID типа актива
        symbol:
          type: string
          description: Символ актива (например, "AAPL", "BTC")
        quantity:
          type: number
          format: float
          description: Текущее количество актива
        average_price:
          type: number
          format: float
          description: Средняя цена покупки
        last_updated:
          type: string
          format: date-time
          description: Время последнего обновления
      required:
        - user_id
        - asset_type_id
        - symbol
        - quantity
        - average_price

    Transaction:
      type: object
      properties:
        id:
          type: integer
          description: Уникальный идентификатор транзакции
        asset_id:
          type: integer
          description: ID актива
        transaction_type:
          type: string
          enum:
            - BUY
            - SELL
          description: Тип транзакции ("BUY" или "SELL")
        quantity:
          type: number
          format: float
          description: Количество актива
        price_per_unit:
          type: number
          format: float
          description: Цена за единицу актива
        timestamp:
          type: string
          format: date-time
          description: Время совершения транзакции
      required:
        - asset_id
        - transaction_type
        - quantity
        - price_per_unit

    MarketData:
      type: object
      properties:
        id:
          type: integer
          description: Уникальный идентификатор рыночных данных
        asset_symbol:
          type: string
          description: Символ актива (например, "AAPL", "BTC")
        price:
          type: number
          format: float
          description: Текущая цена актива
        timestamp:
          type: string
          format: date-time
          description: Время обновления данных
      required:
        - asset_symbol
        - price

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          description: Уникальный идентификатор профиля
        user_id:
          type: integer
          description: ID пользователя
        avatar_url:
          type: string
          description: Ссылка на аватар пользователя
        portfolio_growth_year:
          type: number
          format: float
          description: Рост портфеля за год
      required:
        - user_id