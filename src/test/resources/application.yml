spring:
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    username: testuser
    password: testpassword
    driver-class-name: org.postgresql.Driver

  session:
    jdbc:
      initialize-schema: never
  profiles:
    active: dev
  jpa:
    hibernate:
      properties:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: create-drop
    show-sql: true
  data:
    jdbc:
      dialect: postgresql

server:
  port: 8082
  address: 0.0.0.0
  url: http://46.29.161.201:8082/
  tomcat:
    uri-encoding: UTF-8

logging:
  level:
    web: debug

jwt:
  secret:
    ${JWT_SECRET}
  access-token:
    ttl:
      ${JWT_ACCESS_TTL}
api:
  tbank:
    token:
      ${TBANK_INVEST_API_TOKEN}
    url:
      instrumentBy: https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/FindInstrument
      shareBy: https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/ShareBy
      currencyBy: https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/CurrencyBy
      getLastPrices: https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.MarketDataService/GetLastPrices


  moex:
    password:
      ${MOEX_API_PASSWORD}
